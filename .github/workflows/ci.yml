name: Musical Zed CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 – BUILD
  # ─────────────────────────────────────────────
  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            src/MusicalZed.API/bin/Release/
            src/MusicalZed.Web/bin/Release/
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2 – UNIT TESTS
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Run Unit Tests
        run: |
          dotnet test tests/MusicalZed.UnitTests \
            --no-restore \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/

  # ─────────────────────────────────────────────
  # JOB 3 – INTEGRATION TESTS
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (API)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Run Integration Tests
        run: |
          dotnet test tests/MusicalZed.IntegrationTests \
            --no-restore \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults/

  # ─────────────────────────────────────────────
  # JOB 4 – E2E TESTS (Playwright)
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Debug)
        run: dotnet build -c Debug --no-restore

      - name: Install Playwright browsers
        run: |
          pwsh tests/MusicalZed.E2ETests/bin/Debug/net9.0/playwright.ps1 install --with-deps chromium

      # Inicia API em background usando nohup para garantir que o processo persiste
      - name: Start API
        run: |
          nohup dotnet run --project src/MusicalZed.API \
            --no-build \
            --urls "http://localhost:5000" \
            > /tmp/api.log 2>&1 &
          echo "API process started"

      # Inicia Web em background
      - name: Start Web
        run: |
          nohup dotnet run --project src/MusicalZed.Web \
            --no-build \
            --urls "http://localhost:5002" \
            > /tmp/web.log 2>&1 &
          echo "Web process started"

      # Aguarda a API estar pronta (até 2 minutos)
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API at http://localhost:5000..."
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:5000/api/categories" -o /dev/null 2>&1; then
              echo "✅ API ready after $i attempts"
              break
            fi
            if [ "$i" = "40" ]; then
              echo "❌ API failed to start. Logs:"
              cat /tmp/api.log
              exit 1
            fi
            echo "  Attempt $i/40 — waiting 3s..."
            sleep 3
          done

      # Aguarda o frontend Blazor estar pronto (até 2 minutos)
      # Extra sleep após detecção para garantir que o SignalR Hub está inicializado
      - name: Wait for Web to be ready
        run: |
          echo "Waiting for Web at http://localhost:5002..."
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:5002" -o /dev/null 2>&1; then
              echo "✅ Web ready after $i attempts — waiting extra 8s for SignalR..."
              sleep 8
              break
            fi
            if [ "$i" = "40" ]; then
              echo "❌ Web failed to start. Logs:"
              cat /tmp/web.log
              exit 1
            fi
            echo "  Attempt $i/40 — waiting 3s..."
            sleep 3
          done

      - name: Run E2E Tests
        env:
          E2E_BASE_URL: http://localhost:5002
        run: |
          dotnet test tests/MusicalZed.E2ETests \
            --no-build \
            --no-restore \
            --settings tests/MusicalZed.E2ETests/playwright.runsettings \
            --logger "trx;LogFileName=e2e-results.trx" \
            --results-directory TestResults

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: TestResults/

      - name: Upload service logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-logs
          path: /tmp/*.log

  # ─────────────────────────────────────────────
  # JOB 5 – PERFORMANCE VALIDATION (k6)
  # ─────────────────────────────────────────────
  performance-validation:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    # Executa apenas em push para main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6 -y

      - name: Restore & Build API
        run: |
          dotnet restore
          dotnet build src/MusicalZed.API -c Debug --no-restore

      - name: Start API
        run: |
          nohup dotnet run --project src/MusicalZed.API \
            --no-build \
            --urls "http://localhost:5000" \
            > /tmp/api.log 2>&1 &
          echo "API process started"

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:5000/api/categories" -o /dev/null 2>&1; then
              echo "✅ API ready"
              break
            fi
            if [ "$i" = "40" ]; then
              echo "❌ API failed. Logs:"; cat /tmp/api.log; exit 1
            fi
            echo "  Attempt $i/40 — waiting 3s..."; sleep 3
          done

      # Smoke test: usa os próprios scenarios da homepage (smoke executor: 1 VU, 10s)
      # Nota: NÃO sobrescrevemos --vus/--duration pois isso substituiria os scenarios
      #       definidos no arquivo e dispararia o aviso de "cli override".
      - name: Run Smoke Test (homepage)
        run: |
          k6 run \
            -e API_URL=http://localhost:5000 \
            --env SCENARIO=smoke \
            tests/MusicalZed.PerformanceTests/k6/scenarios/homepage-load.js

      - name: Run Products Load Test
        run: |
          k6 run \
            -e API_URL=http://localhost:5000 \
            tests/MusicalZed.PerformanceTests/k6/scenarios/products-load.js

      - name: Run Cart Operations Test
        run: |
          k6 run \
            -e API_URL=http://localhost:5000 \
            tests/MusicalZed.PerformanceTests/k6/scenarios/cart-operations.js

      - name: Run Checkout Flow Test
        run: |
          k6 run \
            -e API_URL=http://localhost:5000 \
            tests/MusicalZed.PerformanceTests/k6/scenarios/checkout-flow.js

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: |
            /tmp/api.log
            *.json
